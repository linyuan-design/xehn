      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go 1.26.10
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: engine/go.sum

      - name: Run Engine Unit Tests & Vet
        working-directory: engine
        env:
          GOTOOLCHAIN: "go1.26.10"
        run: |
          go vet ./...
          go test -v -run "TestStatusJSONShape|TestConnectWithoutBackendFailsLoudly|TestConnectThenDisconnect|TestDisconnectDuringConnectingCancels|TestStaleConnectCannotReviveAfterStop|TestRenderUAPI|TestMarkSubExitStoppedDoesNotBreakNormalConnect" .
          go test -v -run "TestParse|TestClassify|TestComplement|TestRule" ./warp

      - name: Install gomobile and build engine.aar
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
          GOTOOLCHAIN: "go1.26.10"
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p app/libs
          cd engine
          gomobile bind -v \
            -javapkg=com.xiaohe \
            -target=android/arm64 \
            -androidapi=24 \
            -ldflags="-w -s" \
            -tags="cmfa,with_gvisor" \
            -o ../app/libs/engine.aar \
            ./
          ls -lh ../app/libs/engine.aar

      - name: Build Debug APK
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g' gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.aliyun.com/d' settings.gradle.kts
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xehn-android-apk-v0.2.58
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error