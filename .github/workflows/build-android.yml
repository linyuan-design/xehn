name: Build XEHN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - xehn-android

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xehn-android branch
        uses: actions/checkout@v4
        with:
          ref: xehn-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go 1.26.10
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: engine/go.sum

      - name: Build Go Engine (engine.aar)
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
          GOTOOLCHAIN: "go1.26.10"
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          mkdir -p app/libs
          cd engine
          gomobile bind \
            -javapkg=com.xiaohe \
            -target=android/arm64 \
            -androidapi=24 \
            -ldflags="-w -s" \
            -tags="cmfa,with_gvisor" \
            -o ../app/libs/engine.aar \
            ./
          ls -lh ../app/libs/engine.aar

      - name: Build Android APK with Gradle
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g' gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.aliyun.com/d' settings.gradle.kts
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xehn-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
