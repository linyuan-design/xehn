name: Build Android XEHN APK

on:
  push:
    branches:
      - xehn-android
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.26.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Switch China mirrors to official upstream on CI runner
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|g; s|networkTimeout=10000|networkTimeout=60000|g' gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven\.aliyun\.com/d' settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: engine/go.sum

      - name: Ensure Android SDK platform 35, build-tools 35, and NDK 27
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER=""
          for c in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -x "$c" ]; then
              SDKMANAGER="$c"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${SDK_ROOT}"
            ls -la "${SDK_ROOT}" || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          RUN_SDK="$SDKMANAGER"
          if [ ! -w "$SDK_ROOT" ]; then
            RUN_SDK="sudo -E $SDKMANAGER"
          fi
          yes | $RUN_SDK --licenses >/dev/null 2>&1 || true
          NEED_PKGS=""
          [ -d "${SDK_ROOT}/platforms/android-35" ] || NEED_PKGS="${NEED_PKGS} platforms;android-35"
          [ -d "${SDK_ROOT}/build-tools/35.0.0" ] || NEED_PKGS="${NEED_PKGS} build-tools;35.0.0"
          [ -d "${SDK_ROOT}/platform-tools" ] || NEED_PKGS="${NEED_PKGS} platform-tools"
          NDK_DIR=$(ls -d "${SDK_ROOT}"/ndk/27.* "${SDK_ROOT}"/ndk/* 2>/dev/null | head -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            NEED_PKGS="${NEED_PKGS} ndk;27.0.12077973"
          fi
          if [ -n "$NEED_PKGS" ]; then
            echo "Installing missing SDK packages:${NEED_PKGS}"
            yes | $RUN_SDK $NEED_PKGS
          fi
          NDK_DIR=$(ls -d "${SDK_ROOT}"/ndk/27.* "${SDK_ROOT}"/ndk/* 2>/dev/null | head -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "No Android NDK found after setup"
            exit 1
          fi
          if [ -d "${SDK_ROOT}/licenses" ] && [ ! -w "${SDK_ROOT}/licenses" ]; then
            sudo chmod -R a+rwX "${SDK_ROOT}/licenses" || true
          fi
          echo "Using NDK: ${NDK_DIR}"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> "$GITHUB_ENV"

      - name: Run Go engine unit tests
        working-directory: engine
        run: |
          go test -tags="cmfa,with_gvisor" -timeout 180s . ./warp ./subout

      - name: Build engine.aar via gomobile
        working-directory: engine
        env:
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
        run: |
          MOB_VER=$(awk '$1 == "golang.org/x/mobile" {print $2; exit}' go.mod)
          if [ -z "$MOB_VER" ]; then MOB_VER="latest"; fi
          echo "Installing gomobile/gobind @ ${MOB_VER}"
          go install "golang.org/x/mobile/cmd/gomobile@${MOB_VER}"
          go install "golang.org/x/mobile/cmd/gobind@${MOB_VER}"
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind \
            -javapkg=com.xiaohe \
            -target=android/arm64 \
            -androidapi=24 \
            -ldflags="-w -s" \
            -tags=cmfa,with_gvisor \
            -o ../app/libs/engine.aar \
            ./
          unzip -p ../app/libs/engine.aar classes.jar > /tmp/engine-classes.jar
          javap -cp /tmp/engine-classes.jar com.xiaohe.engine.Engine_ | tee /tmp/engine-sigs.txt
          for m in connect disconnect statusJSON setTunFD versionString logs setLogSink markOpenVPNNodeFailed; do
            grep -q "${m}(" /tmp/engine-sigs.txt || { echo "Missing bound method: $m"; exit 1; }
          done

      - name: Build Android APK
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xehn-android-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Android Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          VER=$(basename "$APK_FILE" .apk | sed 's/^xehn-//')
          TAG="android-v${VER}"
          SHA=$(sha256sum "$APK_FILE" | awk '{print $1}')
          NOTES=$(printf 'XEHN Android v%s (commit %s)\n\nSHA256: `%s`\n' "$VER" "${GITHUB_SHA::7}" "$SHA")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_FILE" --title "XEHN Android v${VER}" --notes "$NOTES"
          fi
