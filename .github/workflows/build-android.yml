      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: engine/go.sum

      - name: Run Engine Unit Tests & Vet
        working-directory: engine
        run: |
          go vet ./...
          go test -v -run "TestStatusJSONShape|TestConnectWithoutBackendFailsLoudly|TestConnectThenDisconnect|TestDisconnectDuringConnectingCancels|TestStaleConnectCannotReviveAfterStop|TestRenderUAPI|TestMarkSubExitStoppedDoesNotBreakNormalConnect" .
          go test -v -run "TestParse|TestClassify|TestComplement|TestRule" ./warp

      - name: Install gomobile and build engine.aar
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260217195705-b56b3793a9c4
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260217195705-b56b3793a9c4
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p app/libs
          cd engine
          go get golang.org/x/mobile/bind@v0.0.0-20260217195705-b56b3793a9c4
          gomobile bind -v -target=android/arm64 -androidapi 24 -javapkg=com.xiaohe -ldflags="-checklinkname=0" -o ../app/libs/engine.aar .
          ls -lh ../app/libs/engine.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk xehn-0.2.58.apk
          ls -lh xehn-0.2.58.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xehn-android-apk-v0.2.58
          path: xehn-0.2.58.apk
