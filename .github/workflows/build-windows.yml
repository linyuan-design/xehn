name: Build Windows XEHN

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "pack.ps1"
      - "rsrc_windows_amd64.syso"
      - ".github/workflows/build-windows.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        shell: pwsh
        run: |
          go test -count=1 -run 'TestOpenVPNBaseTracker|TestPutCachedScan|TestPhase2FallbackPlan|TestVPNGate|TestVPNNode|TestCachedScanRoundTrip|TestOptionsFromState|TestJudgeHealth' .

      - name: Build xehn.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stamp = Get-Date -Format 'yyyyMMdd-HHmm'
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.4-ci-$($env:GITHUB_SHA.Substring(0,7))" }
          "BUILD_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_STAMP=$stamp" | Out-File -FilePath $env:GITHUB_ENV -Append

          New-Item -ItemType Directory -Force -Path dist\build | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$ver -X main.windowsGUIBuild=1 -X main.buildStamp=$stamp" -o dist\build\xehn.exe .

      - name: Download latest mihomo core (best effort)
        shell: pwsh
        run: |
          try {
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/MetaCubeX/mihomo/releases/latest' -Headers @{ 'User-Agent' = 'xehn-ci' }
            $asset = $rel.assets | Where-Object { $_.name -match '^mihomo-windows-amd64-v.*\.zip$' -and $_.name -notmatch 'compatible|go120|go122' } | Select-Object -First 1
            if (-not $asset) {
              $asset = $rel.assets | Where-Object { $_.name -match '^mihomo-windows-amd64-compatible-.*\.zip$' } | Select-Object -First 1
            }
            if ($asset) {
              New-Item -ItemType Directory -Force -Path dist\core_dl | Out-Null
              $zipPath = "dist\core_dl\$($asset.name)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
              Expand-Archive -Path $zipPath -DestinationPath dist\core_dl -Force
              $exe = Get-ChildItem dist\core_dl -Filter '*.exe' -Recurse | Select-Object -First 1
              if ($exe) {
                "MIHOMO_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
                Write-Host "Downloaded mihomo: $($exe.Name)"
              }
            }
          } catch {
            Write-Warning "Skipping mihomo bundle (GUI will download on first run): $_"
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $argsList = @('-SkipBuild', '-Version', $env:BUILD_VER)
          if ($env:MIHOMO_PATH -and (Test-Path $env:MIHOMO_PATH)) {
            $argsList += @('-MihomoPath', $env:MIHOMO_PATH)
          }
          & .\pack.ps1 @argsList

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XEHN-windows-amd64-${{ env.BUILD_VER }}
          path: |
            dist/XEHN.*.zip
            dist/build/xehn.exe
          retention-days: 30

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XEHN.*.zip
            dist/build/xehn.exe
